  <style>
    /* Gruvbox Dark Hard */
    :root {
      --bg-hard: #1d2021;
      --bg: #282828;
      --bg1: #3c3836;
      --bg2: #504945;
      --bg3: #665c54;
      --bg4: #7c6f64;
      --fg: #ebdbb2;
      --fg0: #fbf1c7;
      --fg2: #d5c4a1;
      --fg3: #bdae93;
      --fg4: #a89984;
      --red: #fb4934;
      --green: #b8bb26;
      --yellow: #fabd2f;
      --blue: #83a598;
      --purple: #d3869b;
      --aqua: #8ec07c;
      --orange: #fe8019;
      --gray: #928374;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg-hard);
      min-height: 100vh;
    }

    ::selection { background: var(--bg3); color: var(--fg0); }
    a { color: var(--blue); text-decoration: none; transition: color 0.15s; }
    a:hover { color: var(--aqua); text-decoration: underline; }

    .site-container { display: flex; flex-direction: column; min-height: 100vh; }

    /* Top bar */
    .topbar {
      background: var(--bg1);
      border-bottom: 1px solid var(--bg3);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .site-title { color: var(--green); font-weight: 600; font-size: 1rem; }
    .site-title:hover { color: var(--aqua); text-decoration: none; }

    .nav-tabs { display: flex; gap: 0; list-style: none; }
    .nav-tabs li a {
      display: block;
      padding: 0.4rem 1rem;
      color: var(--fg4);
      background: var(--bg);
      border: 1px solid var(--bg2);
      border-bottom: none;
      margin-left: -1px;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .nav-tabs li:first-child a { border-radius: 4px 0 0 0; margin-left: 0; }
    .nav-tabs li:last-child a { border-radius: 0 4px 0 0; }
    .nav-tabs li a:hover { background: var(--bg1); color: var(--fg); text-decoration: none; }
    .nav-tabs li a.active { background: var(--bg-hard); color: var(--fg0); border-color: var(--bg3); }

    .main-content { flex: 1; display: flex; overflow: hidden; }
    .content-wrapper { flex: 1; overflow-y: auto; padding: 2rem; max-width: 1200px; margin: 0 auto; }

    /* Wikipedia article styles */
    .wiki-article { max-width: 900px; }
    .wiki-article h1 {
      color: var(--fg0);
      font-size: 1.8rem;
      font-weight: 400;
      border-bottom: 1px solid var(--bg3);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .wiki-article h2 {
      color: var(--orange);
      font-size: 1.2rem;
      font-weight: 500;
      border-bottom: 1px solid var(--bg2);
      padding-bottom: 0.3rem;
      margin: 1.5rem 0 0.75rem 0;
    }
    .wiki-article h3 { color: var(--yellow); font-size: 1rem; font-weight: 500; margin: 1rem 0 0.5rem 0; }
    .wiki-article p { margin: 0.75rem 0; color: var(--fg); }
    .wiki-article ul, .wiki-article ol { margin: 0.75rem 0 0.75rem 1.5rem; color: var(--fg2); }
    .wiki-article li { margin: 0.3rem 0; }

    /* Infobox */
    .infobox {
      float: right;
      width: 360px;
      margin: 0 0 1rem 1.5rem;
      background: var(--bg);
      border: 1px solid var(--bg3);
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .infobox-header {
      background: var(--bg1);
      padding: 0.75rem;
      text-align: center;
      border-bottom: 1px solid var(--bg3);
    }
    .infobox-title { color: var(--orange); font-weight: 600; font-size: 1rem; }
    .infobox-subtitle { color: var(--fg4); font-size: 0.8rem; margin-top: 0.25rem; }
    .infobox-image {
      padding: 1rem;
      text-align: center;
      background: var(--bg1);
      border-bottom: 1px solid var(--bg2);
    }
    .infobox-image .avatar {
      width: 200px;
      height: 200px;
      background: var(--bg2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      font-size: 4rem;
      color: var(--fg4);
    }
    .infobox-image .avatar-img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin: 0 auto;
      display: block;
    }
    .infobox-caption { font-size: 0.75rem; color: var(--fg4); margin-top: 0.5rem; font-style: italic; }
    .infobox-data { padding: 0; }
    .infobox-row { display: flex; border-bottom: 1px solid var(--bg1); }
    .infobox-row:last-child { border-bottom: none; }
    .infobox-label {
      width: 110px;
      padding: 0.5rem 0.5rem;
      background: var(--bg1);
      color: var(--fg4);
      font-weight: 500;
      flex-shrink: 0;
      border-right: 1px solid var(--bg2);
      font-size: 0.8rem;
    }
    .infobox-value { 
      padding: 0.5rem 0.5rem; 
      color: var(--fg2); 
      flex: 1; 
      font-size: 0.8rem;
    }

    /* TOC and categories */
    .toc {
      background: var(--bg);
      border: 1px solid var(--bg2);
      border-radius: 4px;
      padding: 1rem;
      margin: 1rem 0;
      display: inline-block;
      min-width: 200px;
    }
    .toc-title { color: var(--fg0); font-weight: 600; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--bg2); }
    .toc-list { list-style: none; margin: 0; padding: 0; }
    .toc-list li { margin: 0.25rem 0; }
    .toc-list a { color: var(--blue); font-size: 0.9rem; }
    .toc-list a:before { content: "› "; color: var(--gray); }

    .categories-box {
      background: var(--bg);
      border: 1px solid var(--bg2);
      border-radius: 4px;
      padding: 0.75rem 1rem;
      margin-top: 2rem;
    }
    .categories-title { color: var(--gray); font-size: 0.8rem; margin-bottom: 0.5rem; }
    .categories-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .category-tag {
      background: var(--bg1);
      color: var(--aqua);
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      font-size: 0.8rem;
      border: 1px solid var(--bg2);
    }
    .category-tag:hover { background: var(--bg2); text-decoration: none; }

    code { background: var(--bg1); color: var(--orange); padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.9em; }
    pre { background: var(--bg); border: 1px solid var(--bg2); border-radius: 4px; padding: 1rem; overflow-x: auto; margin: 1rem 0; }
    pre code { background: none; padding: 0; }

    /* Status bar */
    .statusbar {
      background: var(--bg1);
      border-top: 1px solid var(--bg3);
      padding: 0.3rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      position: sticky;
      bottom: 0;
    }
    .status-left { display: flex; align-items: center; gap: 1rem; }
    .status-mode { background: var(--green); color: var(--bg-hard); padding: 0.15rem 0.6rem; font-weight: 600; border-radius: 2px; }
    .status-mode.command { background: var(--orange); }
    .status-file { color: var(--fg); }
    .status-right { display: flex; align-items: center; gap: 1rem; color: var(--fg4); }
    .status-position { color: var(--aqua); }

    /* Command line */
    .cmdline {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg);
      border: 1px solid var(--blue);
      border-radius: 4px;
      padding: 0.5rem;
      min-width: 400px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .cmdline.active { display: block; }
    .cmdline-input { display: flex; align-items: center; gap: 0.5rem; }
    .cmdline-prompt { color: var(--red); font-weight: 600; }
    .cmdline input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }

    /* Which-key */
    .which-key {
      display: none;
      position: fixed;
      bottom: 40px;
      right: 20px;
      background: var(--bg);
      border: 1px solid var(--bg3);
      border-radius: 4px;
      padding: 0.75rem 1rem;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      min-width: 200px;
    }
    .which-key.active { display: block; }
    .which-key-title { color: var(--purple); font-weight: 600; margin-bottom: 0.5rem; font-size: 0.85rem; }
    .which-key-item { display: flex; gap: 0.75rem; margin: 0.25rem 0; font-size: 0.85rem; }
    .which-key-key { color: var(--blue); min-width: 40px; }
    .which-key-desc { color: var(--fg4); }

    /* File explorer */
    .file-explorer {
      display: none;
      position: fixed;
      top: 45px;
      left: 0;
      bottom: 40px;
      width: 250px;
      background: var(--bg);
      border-right: 1px solid var(--bg3);
      z-index: 50;
      overflow-y: auto;
    }
    .file-explorer.active { display: block; }
    .file-explorer-header {
      padding: 0.75rem 1rem;
      color: var(--purple);
      font-weight: 600;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--bg2);
      position: sticky;
      top: 0;
      background: var(--bg);
    }
    .file-tree { padding: 0.5rem 0; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 1rem;
      color: var(--fg2);
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.1s;
      outline: none;
    }
    .file-item:hover, .file-item.focused { background: var(--bg1); }
    .file-item.active { background: var(--bg2); color: var(--fg0); }
    .file-item.focused { outline: 1px solid var(--blue); outline-offset: -1px; }
    .file-icon { width: 16px; text-align: center; }
    .file-icon.dir { color: var(--blue); }
    .file-icon.tex { color: var(--green); }
    .file-icon.md { color: var(--aqua); }

    /* Nested folder styles */
    .file-folder { }
    .folder-arrow { 
      color: var(--fg4); 
      font-size: 0.7rem; 
      width: 12px; 
      display: inline-block;

    async function navigate(path) {
      // Normalize trailing slashes (but keep root /)
      if (path !== '/' && path.endsWith('/')) {
        path = path.slice(0, -1);
      }
      
      // Check for blog post route
      if (path.startsWith('/blog/') && path !== '/blog') {
        const slug = path.replace('/blog/', '');
        await loadBlogPost(slug);
        return;
      }
      
      // Check for notes routes
      const notesParts = path.split('/').filter(p => p);
      if (notesParts[0] === 'notes' && notesParts.length === 2) {
        // /notes/calculus-i -> course overview
        await loadCourseOverview(notesParts[1]);
        return;
      }
      if (notesParts[0] === 'notes' && notesParts.length === 3) {
        // /notes/calculus-i/2-2-the-limit -> section content
        await loadNoteSection(notesParts[1], notesParts[2]);
        return;
      }
      
      // Check for homework routes
      const hwParts = path.split('/').filter(p => p);
      if (hwParts[0] === 'homework' && hwParts.length === 2) {
        // /homework/math-55a -> course assignments list
        await loadHomeworkCourse(hwParts[1]);
        return;
      }
      if (hwParts[0] === 'homework' && hwParts.length === 3) {
        // /homework/math-55a/pset-1 -> assignment content
        await loadHomeworkAssignment(hwParts[1], hwParts[2]);
        return;
      }

      // Check for atlas routes (ANABASIS; direct-link only, intentionally not in nav)
      const atlasParts = path.split('/').filter(p => p);
      if (atlasParts[0] === 'atlas') {
        if (atlasParts.length === 1) { await loadAtlasIndex(); return; }
        if (atlasParts.length === 2) { await loadAtlasEntry(atlasParts[1]); return; }
      }

      const content = pages[path];
      if (!content) {
        document.getElementById('app').innerHTML = `
          <div class="wiki-article">
            <h1>404 — Not Found</h1>
            <p>No file at <code>${path}</code></p>
            <p><a href="/" data-link>Return home</a></p>
          </div>
        `;
        document.getElementById('status-file').textContent = '~/stephens/404';
        history.pushState({}, '', path);
        return;
      }
      if (content === 'dynamic') return; // handled above
      
      document.getElementById('app').innerHTML = content;
      
      document.querySelectorAll('.nav-tabs a').forEach(a => {
        const href = a.getAttribute('href');
        const isActive = path === href || (path.startsWith('/blog/') && href === '/blog');
        a.classList.toggle('active', isActive);
      });
      document.querySelectorAll('.file-item').forEach(item => {
        item.classList.toggle('active', item.dataset.link === path);
      });
      
      const pathMap = {
        '/': '~/stephens/home',
        '/about': '~/stephens/about.md',
        '/research': '~/stephens/research.tex',
        '/blog': '~/stephens/blog/',
        '/music': '~/stephens/music.md',

        '/notes': '~/stephens/notes/',
        '/homework': '~/stephens/homework/',
        '/educational': '~/stephens/educational/'

      history.pushState({}, '', path);
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (path === '/music') await loadMusic();
      if (path === '/notes') await loadNotesCourseList();
      if (path === '/homework') await loadHomeworkCourseList();
      if (path === '/educational') await loadCourses();
      
      renderMath();
    }

    // Markdown with LaTeX protection
    function renderMarkdown(md) {
      // Strip YAML frontmatter if present (tolerant of whitespace)
      md = md.replace(/^--- *\n[\s\S]*?\n--- *\n/, '');
      
      // Protect LaTeX blocks from marked.js
      const blocks = [];
      let protected = md.replace(/\$\$[\s\S]*?\$\$/g, (match) => {
        blocks.push(match);
        return `%%LATEX_BLOCK_${blocks.length - 1}%%`;
      });
      protected = protected.replace(/\$[^\$\n]+?\$/g, (match) => {
        blocks.push(match);
        return `%%LATEX_INLINE_${blocks.length - 1}%%`;
      });
      
      // Parse markdown
      let html = marked.parse(protected);
      
      // Restore LaTeX
      html = html.replace(/%%LATEX_(BLOCK|INLINE)_(\d+)%%/g, (_, type, idx) => blocks[parseInt(idx)]);
      
      return html;
    }

    // Music: own works, arrangements, recordings (driven by /music/music.json)
    async function loadMusic() {
      const container = document.getElementById('music-content');
      if (!container) return;
      try {
        const res = await fetch('/music/music.json');
        const data = await res.json();
        let html = data.intro ? `<p>${data.intro}</p>` : '';
        for (const sec of data.sections) {
          if (!sec.items || sec.items.length === 0) continue;
          html += `<h2>${sec.title}</h2><ul class="music-list">`;
          for (const it of sec.items) {
            let head = it.title || it.name || '';
            if (it.composer) head += ` — ${it.composer}`;
            if (it.year) head += ` (${it.year})`;
            const meta = [it.instrumentation, it.duration].filter(Boolean).join(' · ');
            const links = [
              it.score ? `<a href="${it.score}" target="_blank">score</a>` : '',
              it.audio ? `<a href="${it.audio}" target="_blank">audio</a>` : ''
            ].filter(Boolean).join(' · ');
            html += `<li class="music-item"><span class="music-head">${head}</span>`
              + (meta ? `<div class="post-meta">${meta}</div>` : '')
              + (it.note ? `<div class="music-note">${it.note}</div>` : '')
              + (links ? `<div class="post-meta">${links}</div>` : '')
              + '</li>';
          }
          html += '</ul>';
        }
        container.innerHTML = html || '<p>Nothing here yet.</p>';
      } catch (e) {
        container.innerHTML = '<p>Error loading music.</p>';
      }
    }

    async function loadBlogPost(slug) {
      // Check if we're returning from Giscus auth (URL has giscus hash or we already have the right post loaded)
      const currentSlug = window.location.pathname.replace('/blog/', '');
      const existingGiscus = document.querySelector('.giscus iframe');
      const existingPostContent = document.querySelector('.post-content');
      
      // If same post is already loaded and Giscus iframe exists, don't reload (preserves auth state)
      if (existingGiscus && existingPostContent && currentSlug === slug) {
        return;
      }
      
      document.getElementById('app').innerHTML = '<p class="loading">Loading post...</p>';
      
      try {
        const res = await fetch(`/blog/${slug}.md`);
        if (!res.ok) throw new Error('Not found');
        const md = await res.text();
        const html = renderMarkdown(md);
        
        document.getElementById('app').innerHTML = `
          <div class="wiki-article">
            <a href="/blog" class="back-link" data-link>Back to blog</a>
            <div class="post-content">${html}</div>
            <div class="comments-section">
              <h2>Comments</h2>
              <div class="giscus"></div>
            </div>
          </div>
        `;
        
        document.getElementById('status-file').textContent = `~/stephens/blog/${slug}.md`;
        // Preserve giscus auth token in URL if present (needed for auth callback)
        const giscusParam = window.location.search.includes('giscus') ? window.location.search : '';
        history.pushState({}, '', `/blog/${slug}${giscusParam}`);
        renderMath();
        loadGiscus();
      } catch (e) {
        document.getElementById('app').innerHTML = `
          <div class="wiki-article">
            <a href="/blog" class="back-link" data-link>Back to blog</a>
            <p>Post not found.</p>
          </div>
        `;
      }
    }

    function renderNoteMarkdown(md) {
      // Strip frontmatter
      md = md.replace(/^--- *\n[\s\S]*?\n--- *\n/, '');
      
      // FIRST: Protect all LaTeX globally before ANY processing
      const latexBlocks = [];
      md = md.replace(/\$\$[\s\S]*?\$\$/g, (match) => {
        latexBlocks.push(match);
        return `%%LATEX_BLOCK_${latexBlocks.length - 1}%%`;
      });
      md = md.replace(/\$[^\$\n]+?\$/g, (match) => {
        latexBlocks.push(match);
        return `%%LATEX_INLINE_${latexBlocks.length - 1}%%`;
      });
      
      // Helper to process inner content (just marked, LaTeX already protected)
      const processInner = (content) => marked.parse(content);
      
      // Convert :::example with nested :::solution (must come first)
      // Handle both ":::example\n" and ":::example Title\n" formats
      // Use negative lookahead to not cross other ::: boundaries
      md = md.replace(/:::example[ \t]*([^\n]*)\n((?:(?!:::).|\n)*?):::solution\s*[\r\n]+([\s\S]*?):::\s*[\r\n]*:::/g,
        (_, title, ex, sol) => {
          const titleHtml = title.trim() ? `<div class="note-box-title">${processInner(title.trim())}</div>` : '';
          return `<div class="note-box note-example">${titleHtml}<div class="note-box-content">${processInner(ex.trim())}</div><details class="note-solution"><summary>Show Solution</summary><div class="note-solution-content">${processInner(sol.trim())}</div></details></div>`;
        });
      
      // Convert standalone :::example blocks (no solution)
      // Handle both ":::example\n" and ":::example Title\n" formats
      md = md.replace(/:::example[ \t]*([^\n]*)\n([\s\S]*?):::/g,
        (_, title, content) => {
          const titleHtml = title.trim() ? `<div class="note-box-title">${processInner(title.trim())}</div>` : '<div class="note-box-title">Example</div>';
          return `<div class="note-box note-example">${titleHtml}<div class="note-box-content">${processInner(content.trim())}</div></div>`;
        });
      
      // Convert :::definition blocks
      md = md.replace(/:::definition\s*[\r\n]+([\s\S]*?):::/g, 
        (_, content) => `<div class="note-box note-definition"><div class="note-box-title">Definition</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::theorem blocks (with optional nested :::proof)
      // Use negative lookahead to not cross other ::: boundaries
      md = md.replace(/:::theorem\s*[\r\n]+((?:(?!:::).|\n)*?):::proof\s*[\r\n]+([\s\S]*?):::\s*[\r\n]*:::/g,
        (_, thm, proof) => `<div class="note-box note-theorem"><div class="note-box-title">Theorem</div><div class="note-box-content">${processInner(thm.trim())}</div><div class="note-box note-proof"><div class="note-box-title">Proof</div><div class="note-box-content">${processInner(proof.trim())}</div></div></div>`);
      
      // Convert standalone :::theorem blocks
      md = md.replace(/:::theorem\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-theorem"><div class="note-box-title">Theorem</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::proof blocks
      md = md.replace(/:::proof\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-proof"><div class="note-box-title">Proof</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::note blocks
      md = md.replace(/:::note\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-note"><div class="note-box-title">Note</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::proposition blocks (with optional nested :::proof)
      // Use negative lookahead to not cross other ::: boundaries
      md = md.replace(/:::proposition\s*[\r\n]+((?:(?!:::).|\n)*?):::proof\s*[\r\n]+([\s\S]*?):::\s*[\r\n]*:::/g,
        (_, prop, proof) => `<div class="note-box note-proposition"><div class="note-box-title">Proposition</div><div class="note-box-content">${processInner(prop.trim())}</div><div class="note-box note-proof"><div class="note-box-title">Proof</div><div class="note-box-content">${processInner(proof.trim())}</div></div></div>`);
      
      // Convert standalone :::proposition blocks
      md = md.replace(/:::proposition\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-proposition"><div class="note-box-title">Proposition</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::corollary blocks
      md = md.replace(/:::corollary\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-corollary"><div class="note-box-title">Corollary</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Process remaining markdown outside boxes
      let html = marked.parse(md);
      
      // Restore ALL LaTeX at the very end
      html = html.replace(/%%LATEX_(BLOCK|INLINE)_(\d+)%%/g, (_, type, idx) => latexBlocks[parseInt(idx)]);
      
      return html;
    }

    function updateNavState(basePath, statusPath, fullPath) {
      document.querySelectorAll('.nav-tabs a').forEach(a => {
        const href = a.getAttribute('href');
        a.classList.toggle('active', href === basePath);
      });
      document.getElementById('status-file').textContent = statusPath;
      if (fullPath && window.location.pathname !== fullPath) {
        history.pushState({}, '', fullPath);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ===== ANABASIS atlas (direct-link only; intentionally not in nav yet) =====
    const ATLAS_LVLC = {0:'#b8bb26',1:'#8ec07c',2:'#fabd2f',3:'#fe8019',4:'#fb4934',5:'#d3869b'};
    const ATLAS_LVLNAME = {0:'foundational',1:'pre-competition',2:'competition',3:'olympiad',4:'putnam',5:'and beyond'};
    if (window.cytoscapeFcose) { try { cytoscape.use(window.cytoscapeFcose); } catch (e) {} }
    let atlasCy = null;

    async function ensureAtlasData() {
      if (window.__ATLAS) return window.__ATLAS;
      const [domains, index] = await Promise.all([
        fetch('/atlas/atlas.json').then(r => r.json()),
        fetch('/atlas/index.json').then(r => r.json()),
      ]);
      window.__ATLAS = { domains, index, ids: Object.keys(index) };
      return window.__ATLAS;
    }

    async function loadAtlasIndex(preDomain) {
      let A;
      try { A = await ensureAtlasData(); }
      catch (e) { document.getElementById('app').innerHTML = '<div class="wiki-article"><h1>Atlas unavailable</h1></div>'; return; }
      const domTitle = {}; A.domains.forEach(d => domTitle[d.slug] = d.name);
      const st = { q:'', sort:'domain', domain:(preDomain && A.domains.some(d=>d.slug===preDomain))?preDomain:'all', levels:new Set() };
      const inp = 'background:#282828;border:1px solid #3c3836;color:#d5c4a1;font-family:inherit;font-size:12px;padding:8px;border-radius:8px;outline:none';
      document.getElementById('app').innerHTML =
        '<div class="wiki-article" style="max-width:none">'
        + '<div class="note-breadcrumb">Atlas</div>'
        + '<h1>ANABASIS &mdash; Atlas of Mathematical Results</h1>'
        + '<p style="color:#a89984">A discovery-first map from arithmetic to Putnam level. Search or filter the '
        + A.ids.length + ' nodes, or explore the prerequisite graph &mdash; every arrow points from a prerequisite to what it unlocks.</p>'
        + '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0">'
        + '<input id="atlas-q" placeholder="Search name, id, tag…" autocomplete="off" spellcheck="false" style="flex:1;min-width:200px;'+inp+';font-size:13px;padding:9px 12px">'
        + '<select id="atlas-sort" style="'+inp+'"><option value="domain">Group by domain</option><option value="level">Group by level</option><option value="az">A&ndash;Z</option></select>'
        + '<select id="atlas-domf" style="'+inp+'"></select>'
        + '<span id="atlas-levels" style="display:flex;gap:4px"></span></div>'
        + '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">'
        + '<div id="atlas-list" style="flex:1;min-width:260px;max-height:560px;overflow:auto;border:1px solid #3c3836;border-radius:10px;padding:6px"></div>'
        + '<div style="flex:2;min-width:320px;position:relative">'
        + '<div id="atlas-cy" style="width:100%;height:560px;border:1px solid #3c3836;border-radius:10px;background:#1d2021"></div>'
        + '<div id="atlas-legend" style="position:absolute;bottom:10px;left:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#a89984;background:rgba(40,40,40,.85);border:1px solid #3c3836;border-radius:8px;padding:7px 10px"></div>'
        + '</div></div></div>';
      updateNavState('/atlas', '~/stephens/atlas/', preDomain ? ('/atlas/'+preDomain) : '/atlas');

      const domf = document.getElementById('atlas-domf');
      domf.innerHTML = '<option value="all">All domains</option>' + A.domains.map(d => '<option value="'+d.slug+'">'+d.name+'</option>').join('');
      domf.value = st.domain;
      document.getElementById('atlas-sort').value = st.sort;
      const lv = document.getElementById('atlas-levels');
      lv.innerHTML = [0,1,2,3,4,5].map(l => '<span data-l="'+l+'" style="cursor:pointer;font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid #504945;color:#a89984">L'+l+'</span>').join('');
      lv.querySelectorAll('[data-l]').forEach(c => c.onclick = () => {
        const l = +c.dataset.l;
        if (st.levels.has(l)) { st.levels.delete(l); c.style.background=''; c.style.color='#a89984'; }
        else { st.levels.add(l); c.style.background=ATLAS_LVLC[l]; c.style.color='#1d2021'; }
        renderList();
      });
      document.getElementById('atlas-legend').innerHTML = [0,1,2,3,4,5].map(l =>
        '<span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:50%;background:'+ATLAS_LVLC[l]+'"></span>L'+l+' '+ATLAS_LVLNAME[l]+'</span>').join('');

      const matches = () => A.ids.map(id => Object.assign({id}, A.index[id])).filter(n => {
        if (st.domain !== 'all' && n.domain !== st.domain) return false;
        if (st.levels.size && !st.levels.has(n.level)) return false;
        if (st.q) { const hay = (n.name+' '+n.id+' '+(n.tags||[]).join(' ')+' '+n.domain).toLowerCase(); if (!hay.includes(st.q)) return false; }
        return true;
      });
      function renderList() {
        const ns = matches();
        let groups = [];
        if (st.sort === 'az') groups = [['', ns.slice().sort((a,b)=>a.name.localeCompare(b.name))]];
        else if (st.sort === 'level') { for (let l=0;l<=5;l++){ const g=ns.filter(n=>n.level===l).sort((a,b)=>a.name.localeCompare(b.name)); if(g.length) groups.push(['Level '+l+' — '+ATLAS_LVLNAME[l], g]); } }
        else { for (const d of A.domains.map(x=>x.slug)){ const g=ns.filter(n=>n.domain===d).sort((a,b)=>(a.level-b.level)||a.name.localeCompare(b.name)); if(g.length) groups.push([domTitle[d], g]); } }
        let html = '';
        for (const [t,g] of groups) {
          if (t) html += '<div style="color:#8ec07c;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 8px 4px">'+t+'</div>';
          for (const n of g) html += '<div class="atlas-item" data-id="'+n.id+'" style="display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;cursor:pointer"><span style="width:8px;height:8px;border-radius:50%;background:'+ATLAS_LVLC[n.level]+'"></span><span style="font-size:13px;color:#d5c4a1">'+n.name+'</span><span style="margin-left:auto;font-size:10px;color:#7c6f64">L'+n.level+'</span></div>';
        }
        if (!groups.length) html = '<div style="padding:20px;color:#7c6f64;text-align:center">No nodes match.</div>';
        const el = document.getElementById('atlas-list');
        el.innerHTML = html;
        el.querySelectorAll('.atlas-item').forEach(it => {
          it.onmouseenter = () => it.style.background = '#32302f';
          it.onmouseleave = () => it.style.background = '';
          it.onclick = () => navigate('/atlas/' + it.dataset.id);
        });
      }
      document.getElementById('atlas-q').oninput = e => { st.q = e.target.value.toLowerCase(); renderList(); };
      document.getElementById('atlas-sort').onchange = e => { st.sort = e.target.value; renderList(); };
      domf.onchange = e => { st.domain = e.target.value; renderList(); buildAtlasGraph(st.domain); };
      renderList();
      buildAtlasGraph(st.domain);
    }

    function buildAtlasGraph(domain) {
      const A = window.__ATLAS; if (!A || !window.cytoscape) return;
      let ids;
      if (domain === 'all') ids = new Set(A.ids);
      else {
        ids = new Set(A.ids.filter(id => A.index[id].domain === domain));
        for (const id of [...ids]) (A.index[id].prereqs||[]).concat(A.index[id].unlocks||[]).forEach(x => { if (A.index[x]) ids.add(x); });
      }
      const els = [];
      for (const id of ids) { const n = A.index[id]; els.push({ data:{id,label:n.name,lvl:n.level}, classes:(domain!=='all'&&n.domain!==domain)?'ext':'' }); }
      for (const id of ids) (A.index[id].prereqs||[]).forEach(p => { if (ids.has(p)) els.push({ data:{id:p+'>'+id, source:p, target:id} }); });
      if (atlasCy) { atlasCy.destroy(); atlasCy = null; }
      atlasCy = cytoscape({
        container: document.getElementById('atlas-cy'), elements: els,
        style: [

      try {
        const A = await ensureAtlasData();

      const domName = (domains.find(d => d.slug === meta.domain) || {}).name || meta.domain;
      const md = await (await fetch('/atlas/' + meta.domain + '/' + id + '.md')).text();
      const rendered = renderNoteMarkdown(md);

      const chipRow = (title, ids) => (ids && ids.length)

          + '<div class="categories-list">' + ids.map(chip).join(' ') + '</div></div>'
        : '';
      const html = '<div class="wiki-article note-section">'
        + '<div class="note-breadcrumb"><a href="/atlas" data-link>Atlas</a> / '

        + '<div class="note-content">' + rendered + '</div>'

      document.getElementById('app').innerHTML = html;

    // Get all navigable items in the explorer (only visible ones, not in closed folders)
    function getFileItems() {
      return Array.from(document.querySelectorAll('#file-tree .file-item')).filter(item => {
        // Check if item is inside ANY closed folder (traverse all ancestors)
        let el = item.parentElement;
        while (el && el.id !== 'file-tree') {
          if (el.classList.contains('folder-children')) {
            const folder = el.closest('.file-folder');
            if (folder && !folder.classList.contains('open')) {
              return false; // Skip items in closed folders
            }
          }
          el = el.parentElement;
        }
        return true;
      });
    }

    function toggleExplorer() {
      const isActive = fileExplorer.classList.toggle('active');
      if (isActive) {
        explorerFocusIndex = 0;
        updateExplorerFocus();
      } else {
        explorerFocusIndex = -1;
        getFileItems().forEach(item => item.classList.remove('focused'));
      }
    }

    function updateExplorerFocus() {
      const items = getFileItems();
      items.forEach((item, i) => {
        item.classList.toggle('focused', i === explorerFocusIndex);
      });
      if (explorerFocusIndex >= 0 && items[explorerFocusIndex]) {
        items[explorerFocusIndex].scrollIntoView({ block: 'nearest' });
      }
    }

    cmdlineInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const input = cmdlineInput.value.trim();
        const cmd = input.toLowerCase().split(' ')[0];
        const args = input.slice(cmd.length).trim();
        closeCmdline();
        
        if (cmdlineMode === 'search') {
          // Search mode: fuzzy navigate to pages
          if (cmd.includes('home') || cmd === 'h') navigate('/');
          else if (cmd.includes('about') || cmd === 'a') navigate('/about');
          else if (cmd.includes('research') || cmd === 'r') navigate('/research');
          else if (cmd.includes('blog') || cmd === 'b') navigate('/blog');
          else if (cmd.includes('tech')) navigate('/educational');
          else if (cmd.includes('note') || cmd === 'n') navigate('/notes');
          else if (cmd.includes('edu') || cmd === 'e') navigate('/educational');
          else if (cmd.includes('music') || cmd === 'm') navigate('/music');
          else if (cmd.includes('help')) showHelp();
        } else {
          // Command mode
          if (commands[cmd]) {
            commands[cmd](args);
          } else if (cmd) {
            showMessage('Unknown command: ' + cmd);
          }
        }
      } else if (e.key === 'Escape') {
        closeCmdline();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      
      const now = Date.now();
      const isDoublePress = (e.key === lastKey) && (now - lastKeyTime < 300);
      const explorerOpen = fileExplorer.classList.contains('active');
      const items = getFileItems();

      // File explorer navigation
      if (explorerOpen) {
        if (e.key === 'ArrowDown' || e.key === 'j') {
          e.preventDefault();
          explorerFocusIndex = Math.min(explorerFocusIndex + 1, items.length - 1);
          updateExplorerFocus();
          lastKey = e.key;
          lastKeyTime = now;
          return;
        }
        if (e.key === 'ArrowUp' || e.key === 'k') {
          e.preventDefault();
          explorerFocusIndex = Math.max(explorerFocusIndex - 1, 0);
          updateExplorerFocus();
          lastKey = e.key;
          lastKeyTime = now;
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          if (explorerFocusIndex >= 0 && items[explorerFocusIndex]) {
            const focusedItem = items[explorerFocusIndex];
            
            // Check if it's a folder toggle
            if (focusedItem.classList.contains('folder-toggle')) {
              const folder = focusedItem.closest('.file-folder');
              if (folder) {
                folder.classList.toggle('open');
                // Stay on the folder item after toggling
                setTimeout(() => {
                  const newItems = getFileItems();
                  explorerFocusIndex = newItems.indexOf(focusedItem);
                  updateExplorerFocus();
                }, 10);
              }
            } else {
              // Regular file item - navigate
              const path = focusedItem.dataset.link;
              const scrollTarget = focusedItem.dataset.scroll;
              if (path) {
                if (scrollTarget) pendingScrollTarget = scrollTarget;
                navigate(path);
                fileExplorer.classList.remove('active');
                explorerFocusIndex = -1;
                items.forEach(item => item.classList.remove('focused'));
              }
            }
          }
          lastKey = e.key;
          lastKeyTime = now;
          return;
        }
        if (e.key === 'Escape') {
          fileExplorer.classList.remove('active');
          explorerFocusIndex = -1;
          items.forEach(item => item.classList.remove('focused'));
          lastKey = e.key;
          lastKeyTime = now;
          return;
        }
      }

      // Leader key (Space)
      if (e.key === ' ' && !cmdline.classList.contains('active')) {
        e.preventDefault();
        showWhichKey();
        clearTimeout(leaderTimeout);
        leaderTimeout = setTimeout(hideWhichKey, 2000);
        lastKey = e.key;
        lastKeyTime = now;
        return;
      }

      // Leader combinations
      if (leaderActive) {
        e.preventDefault();
        hideWhichKey();
        if (e.key === 'e') toggleExplorer();
        else if (e.key === '/') openCmdline();
        lastKey = e.key;
        lastKeyTime = now;
        return;
      }

      // Normal mode
      switch(e.key) {
        case 'j': window.scrollBy({ top: 100, behavior: 'smooth' }); break;
        case 'k': window.scrollBy({ top: -100, behavior: 'smooth' }); break;
        case 'G':
          if (e.shiftKey && isDoublePress) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          break;
        case 'g':
          if (!e.shiftKey && isDoublePress) window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        case '/':
          e.preventDefault();
          openCmdline('search');
          break;
        case ':':
          e.preventDefault();
          openCmdline('command');
          break;
        case 'Escape':
          closeCmdline();
          hideWhichKey();
          break;
      }
      lastKey = e.key;
      lastKeyTime = now;
    });

    // Status bar
    function updateScrollPosition() {
      const scrollTop = window.scrollY;
      const scrollHeight = document.body.scrollHeight - window.innerHeight;
      const pos = document.getElementById('status-position');
      if (scrollTop <= 10) pos.textContent = 'Top';
      else if (scrollTop >= scrollHeight - 10) pos.textContent = 'Bot';
      else pos.textContent = Math.round((scrollTop / scrollHeight) * 100) + '%';
    }

    function updateTime() {
      document.getElementById('status-time').textContent = new Date().toLocaleTimeString('en-US', { 
        hour: '2-digit', minute: '2-digit', hour12: false 
      });
    }

    window.addEventListener('scroll', updateScrollPosition);
    setInterval(updateTime, 1000);

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      navigate(window.location.pathname);
      updateScrollPosition();
      updateTime();
      loadExplorerFolders();
    });
  </script>
</body>
</html>
