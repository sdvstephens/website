  <style>
    /* ===== Typefaces =====================================================
       Adobe Caslon Pro carries blog prose; Irvin (the font's internal family
       name is "New Yorker") is display-only — 232 glyphs, no small caps, no
       old-style figures, so it is never used below ~2rem.
       Semibold is registered at 600 and true Bold at 700: on a dark ground
       Caslon's Bold is too dense for running text, so blog <strong> is
       pinned to 600 further down. Bold is declared but not fetched unless
       something explicitly asks for 700. */
    @font-face {
      font-family: 'Adobe Caslon Pro';
      src: url('/assets/fonts/ACaslonPro-Regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Adobe Caslon Pro';
      src: url('/assets/fonts/ACaslonPro-Italic.woff2') format('woff2');
      font-weight: 400; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Adobe Caslon Pro';
      src: url('/assets/fonts/ACaslonPro-Semibold.woff2') format('woff2');
      font-weight: 600; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Adobe Caslon Pro';
      src: url('/assets/fonts/ACaslonPro-SemiboldItalic.woff2') format('woff2');
      font-weight: 600; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Adobe Caslon Pro';
      src: url('/assets/fonts/ACaslonPro-Bold.woff2') format('woff2');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Adobe Caslon Pro';
      src: url('/assets/fonts/ACaslonPro-BoldItalic.woff2') format('woff2');
      font-weight: 700; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Irvin';
      src: url('/assets/fonts/NYIrvin.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }

    /* Gruvbox Dark Hard */
    :root {
      --bg-hard: #1d2021;
      --bg: #282828;
      --bg1: #3c3836;
      --bg2: #504945;
      --bg3: #665c54;
      --bg4: #7c6f64;
      --fg: #ebdbb2;
      --fg0: #fbf1c7;
      --fg2: #d5c4a1;
      --fg3: #bdae93;
      --fg4: #a89984;
      --red: #fb4934;
      --green: #b8bb26;
      --yellow: #fabd2f;
      --blue: #83a598;
      --purple: #d3869b;
      --aqua: #8ec07c;
      --orange: #fe8019;
      --gray: #928374;

      /* Typography */
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-serif: 'Adobe Caslon Pro', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
      --font-display: 'Irvin', 'Adobe Caslon Pro', Georgia, serif;

      /* Blog prose knobs. Caslon's x-height is 0.414em against JetBrains
         Mono's ~0.55, so it needs roughly 30% more size to read at the same
         apparent scale. Its mean advance is 0.417em — unusually narrow — so
         an em measure buys more characters here than in most faces: at 20px,
         each 1em of measure is ~2.4 characters. 45em lands at ~108 characters
         and 900px, filling --blog-width exactly. (30em/~72 chars is the
         conventional range if you ever want to come back down.) */
      --blog-size: 1.25rem;
      --blog-measure: 45em;

      /* Measure for .serif pages (/about and anything else you tag), kept
         separate from --blog-measure so the two can diverge: the blog wants a
         tight reading column, /about wants to fill the width. 46em at 20px is
         ~110 characters. Set to `none` to remove the cap entirely and let
         --article-max govern, or drop toward 30em to match the blog. */
      --serif-measure: 46em;

      /* Width of the blog column as a whole — masthead rule, tag cloud, post
         cards. Deliberately NOT tied to --blog-measure: that governs prose
         line length only, and letting it drive the container too shrank the
         chrome and pushed the tag cloud onto an extra row. Raise this to widen
         the blog without touching line length. */
      --blog-width: 900px;

      /* Infobox size when it is set in Caslon (see .infobox.serif). Caslon's
         0.414em x-height needs more than the 0.8rem the mono version uses.
         If the box feels too big or starts crowding, change this one number. */
      --infobox-serif-size: 0.95rem;

      /* Layout. Two nested caps: --page-max bounds the scroll area, and
         --article-max bounds the text column inside it. Raise --article-max
         to fill more of a wide screen, lower it for tighter margins. Both
         columns are centred, so the side gutters always stay equal. */
      --page-max: 1200px;
      --article-max: 1100px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg-hard);
      min-height: 100vh;
    }

    ::selection { background: var(--bg3); color: var(--fg0); }
    a { color: var(--blue); text-decoration: none; transition: color 0.15s; }
    a:hover { color: var(--aqua); text-decoration: underline; }

    .site-container { display: flex; flex-direction: column; min-height: 100vh; }

    /* Top bar */
    .topbar {
      background: var(--bg1);
      border-bottom: 1px solid var(--bg3);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .site-title { color: var(--green); font-weight: 600; font-size: 1rem; }
    .site-title:hover { color: var(--aqua); text-decoration: none; }

    .nav-tabs { display: flex; gap: 0; list-style: none; }
    .nav-tabs li a {
      display: block;
      padding: 0.4rem 1rem;
      color: var(--fg4);
      background: var(--bg);
      border: 1px solid var(--bg2);
      border-bottom: none;
      margin-left: -1px;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .nav-tabs li:first-child a { border-radius: 4px 0 0 0; margin-left: 0; }
    .nav-tabs li:last-child a { border-radius: 0 4px 0 0; }
    .nav-tabs li a:hover { background: var(--bg1); color: var(--fg); text-decoration: none; }
    .nav-tabs li a.active { background: var(--bg-hard); color: var(--fg0); border-color: var(--bg3); }

    .main-content { flex: 1; display: flex; overflow: hidden; }
    .content-wrapper { flex: 1; overflow-y: auto; padding: 2rem; max-width: var(--page-max); margin: 0 auto; }

    /* Wikipedia article styles */
    /* margin-inline:auto is load-bearing. Without it the 900px article pins to
       the left of the 1200px wrapper and drops the whole 300px remainder on
       the right, so the page reads off-centre on any screen wider than the
       wrapper. Centring it splits that space evenly. */
    .wiki-article { max-width: var(--article-max); margin-inline: auto; }
    .wiki-article h1 {
      color: var(--fg0);
      font-size: 1.8rem;
      font-weight: 400;
      border-bottom: 1px solid var(--bg3);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .wiki-article h2 {
      color: var(--orange);
      font-size: 1.2rem;
      font-weight: 500;
      border-bottom: 1px solid var(--bg2);
      padding-bottom: 0.3rem;
      margin: 1.5rem 0 0.75rem 0;
    }
    .wiki-article h3 { color: var(--yellow); font-size: 1rem; font-weight: 500; margin: 1rem 0 0.5rem 0; }
    .wiki-article p { margin: 0.75rem 0; color: var(--fg); }
    .wiki-article ul, .wiki-article ol { margin: 0.75rem 0 0.75rem 1.5rem; color: var(--fg2); }
    .wiki-article li { margin: 0.3rem 0; }

    /* Infobox */
    .infobox {
      float: right;
      width: 360px;
      margin: 0 0 1rem 1.5rem;
      background: var(--bg);
      border: 1px solid var(--bg3);
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .infobox-header {
      background: var(--bg1);
      padding: 0.75rem;
      text-align: center;
      border-bottom: 1px solid var(--bg3);
    }
    .infobox-title { color: var(--orange); font-weight: 600; font-size: 1rem; }
    .infobox-subtitle { color: var(--fg4); font-size: 0.8rem; margin-top: 0.25rem; }
    .infobox-image {
      padding: 1rem;
      text-align: center;
      background: var(--bg1);
      border-bottom: 1px solid var(--bg2);
    }
    .infobox-image .avatar {
      width: 200px;
      height: 200px;
      background: var(--bg2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      font-size: 4rem;
      color: var(--fg4);
    }
    .infobox-image .avatar-img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin: 0 auto;
      display: block;
    }
    .infobox-caption { font-size: 0.75rem; color: var(--fg4); margin-top: 0.5rem; font-style: italic; }
    .infobox-data { padding: 0; }
    .infobox-row { display: flex; border-bottom: 1px solid var(--bg1); }
    .infobox-row:last-child { border-bottom: none; }
    .infobox-label {
      width: 110px;
      padding: 0.5rem 0.5rem;
      background: var(--bg1);
      color: var(--fg4);
      font-weight: 500;
      flex-shrink: 0;
      border-right: 1px solid var(--bg2);
      font-size: 0.8rem;
    }
    .infobox-value { 
      padding: 0.5rem 0.5rem; 
      color: var(--fg2); 
      flex: 1; 
      font-size: 0.8rem;
      /* Flex items default to min-width:auto, so they refuse to shrink below
         their longest unbreakable word and shove the box wider instead of
         wrapping. The long contact addresses hit exactly this. min-width:0
         lets the column shrink; overflow-wrap then breaks inside the word as
         a last resort. Applies to the mono version too, which had the same
         latent overflow. */
      min-width: 0;
      overflow-wrap: break-word;
    }

    /* TOC and categories */
    .toc {
      background: var(--bg);
      border: 1px solid var(--bg2);
      border-radius: 4px;
      padding: 1rem;
      margin: 1rem 0;
      display: inline-block;
      min-width: 200px;
    }
    .toc-title { color: var(--fg0); font-weight: 600; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--bg2); }
    .toc-list { list-style: none; margin: 0; padding: 0; }
    .toc-list li { margin: 0.25rem 0; }
    .toc-list a { color: var(--blue); font-size: 0.9rem; }
    .toc-list a:before { content: "› "; color: var(--gray); }

    .categories-box {
      background: var(--bg);
      border: 1px solid var(--bg2);
      border-radius: 4px;
      padding: 0.75rem 1rem;
      margin-top: 2rem;
    }
    .categories-title { color: var(--gray); font-size: 0.8rem; margin-bottom: 0.5rem; }
    .categories-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .category-tag {
      background: var(--bg1);
      color: var(--aqua);
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      font-size: 0.8rem;
      border: 1px solid var(--bg2);
    }
    .category-tag:hover { background: var(--bg2); text-decoration: none; }

    code { background: var(--bg1); color: var(--orange); padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.9em; }
    pre { background: var(--bg); border: 1px solid var(--bg2); border-radius: 4px; padding: 1rem; overflow-x: auto; margin: 1rem 0; }
    pre code { background: none; padding: 0; }

    /* Status bar */
    .statusbar {
      background: var(--bg1);
      border-top: 1px solid var(--bg3);
      padding: 0.3rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      position: sticky;
      bottom: 0;
    }
    .status-left { display: flex; align-items: center; gap: 1rem; }
    .status-mode { background: var(--green); color: var(--bg-hard); padding: 0.15rem 0.6rem; font-weight: 600; border-radius: 2px; }
    .status-mode.command { background: var(--orange); }
    .status-file { color: var(--fg); }
    .status-right { display: flex; align-items: center; gap: 1rem; color: var(--fg4); }
    .status-position { color: var(--aqua); }

    /* Command line */
    .cmdline {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg);
      border: 1px solid var(--blue);
      border-radius: 4px;
      padding: 0.5rem;
      min-width: 400px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .cmdline.active { display: block; }
    .cmdline-input { display: flex; align-items: center; gap: 0.5rem; }
    .cmdline-prompt { color: var(--red); font-weight: 600; }
    .cmdline input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }

    /* Which-key */
    .which-key {
      display: none;
      position: fixed;
      bottom: 40px;
      right: 20px;
      background: var(--bg);
      border: 1px solid var(--bg3);
      border-radius: 4px;
      padding: 0.75rem 1rem;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      min-width: 200px;
    }
    .which-key.active { display: block; }
    .which-key-title { color: var(--purple); font-weight: 600; margin-bottom: 0.5rem; font-size: 0.85rem; }
    .which-key-item { display: flex; gap: 0.75rem; margin: 0.25rem 0; font-size: 0.85rem; }
    .which-key-key { color: var(--blue); min-width: 40px; }
    .which-key-desc { color: var(--fg4); }

    /* File explorer */
    .file-explorer {
      display: none;
      position: fixed;
      top: 45px;
      left: 0;
      bottom: 40px;
      width: 250px;
      background: var(--bg);
      border-right: 1px solid var(--bg3);
      z-index: 50;
      overflow-y: auto;
    }
    .file-explorer.active { display: block; }
    .file-explorer-header {
      padding: 0.75rem 1rem;
      color: var(--purple);
      font-weight: 600;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--bg2);
      position: sticky;
      top: 0;
      background: var(--bg);
    }
    .file-tree { padding: 0.5rem 0; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 1rem;
      color: var(--fg2);
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.1s;
      outline: none;
    }
    .file-item:hover, .file-item.focused { background: var(--bg1); }
    .file-item.active { background: var(--bg2); color: var(--fg0); }
    .file-item.focused { outline: 1px solid var(--blue); outline-offset: -1px; }
    .file-icon { width: 16px; text-align: center; }
    .file-icon.dir { color: var(--blue); }
    .file-icon.tex { color: var(--green); }
    .file-icon.md { color: var(--aqua); }

    /* Nested folder styles */
    .file-folder { }
    .folder-arrow { 
      color: var(--fg4); 
      font-size: 0.7rem; 
      width: 12px; 
      display: inline-block;
      transition: transform 0.15s;
    }
    .file-folder.open > .folder-arrow { transform: rotate(90deg); }
    .file-folder.open > .folder-toggle .folder-arrow { transform: rotate(90deg); }
    .folder-children { 
      display: none; 
      padding-left: 1rem;
    }
    .file-folder.open > .folder-children { display: block; }
    .folder-children .file-item { 
      padding: 0.25rem 0.75rem 0.25rem 0.5rem;
      font-size: 0.8rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .infobox { float: none; width: 100%; margin: 0 0 1.5rem 0; }
      .nav-tabs { flex-wrap: wrap; }
      .content-wrapper { padding: 1rem; }
    }
    .wiki-article::after { content: ""; display: table; clear: both; }
    .loading { color: var(--gray); text-align: center; padding: 2rem; }

    /* Blog styles */
    .post-list { list-style: none; margin: 0; padding: 0; }
    .post-item { 
      padding: 1rem; 
      margin: 0.5rem 0; 
      background: var(--bg); 
      border: 1px solid var(--bg2); 
      border-radius: 4px;
      transition: border-color 0.15s;
    }
    .post-item:hover { border-color: var(--bg3); }
    .post-title { color: var(--blue); font-size: 1.1rem; font-weight: 500; }
    .post-title:hover { color: var(--aqua); }
    .post-meta { color: var(--fg4); font-size: 0.85rem; margin-top: 0.25rem; }
    .post-excerpt { color: var(--fg2); margin-top: 0.5rem; font-size: 0.9rem; }
    .post-tags { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .post-tag { 
      background: var(--bg1); 
      color: var(--aqua); 
      padding: 0.15rem 0.5rem; 
      border-radius: 3px; 
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .post-tag:hover { background: var(--bg2); }

    /* ===== Blog typography ===============================================
       Everything under .blog-page sets in Caslon; the terminal chrome (dates,
       tags, code, back-link) deliberately stays monospace. That contrast is
       the whole idea — the Neovim shell frames a printed page. */
    .blog-page {
      font-family: var(--font-serif);
      font-size: var(--blog-size);
      line-height: 1.65;
      font-kerning: normal;
      font-variant-numeric: oldstyle-num;
      /* Light-on-dark text blooms optically; the thinner stem helps Caslon. */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* Article width for the blog, ranged left. --blog-width governs the
         container (masthead rule, tag cloud, post cards); --blog-measure only
         caps the prose inside it. margin-inline 0/auto undoes the centring
         .wiki-article applies — the blog reads better ranged left, while
         /about, whose infobox fills the right, stays centred. */
      --article-max: var(--blog-width);
      margin-inline: 0 auto;
    }

    /* The single Irvin moment: the "Blog" masthead. Direct-child selector, so
       post titles rendered inside .post-content stay in Caslon. */
    .blog-page > h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(3rem, 9vw, 5rem);
      line-height: 1.12;
      letter-spacing: 0.01em;
      color: var(--fg0);
      border-bottom: 1px solid var(--bg3);
      padding-bottom: 0.6rem;
      margin-bottom: 1rem;
    }

    /* Standfirst beneath the masthead */
    .blog-page > p {
      font-style: italic;
      font-size: 1.05em;
      color: var(--fg3);
      max-width: var(--blog-measure);
      margin: 0.75rem 0 2.25rem;
    }

    .blog-page > h2 {
      font-family: var(--font-serif);
      font-size: 1.3em;
      font-weight: 600;
      border-bottom: none;
      margin: 1.5rem 0 0.75rem;
    }

    /* --- Index list --- */
    /* Cards span the full column. They hold a title, a date and a one-line
       excerpt, none of which is running prose, so a reading measure would only
       narrow them for no benefit. */
    .blog-page .post-list { max-width: none; }
    .blog-page .post-title {
      font-family: var(--font-serif);
      font-size: 1.3em;
      font-weight: 600;
      line-height: 1.25;
    }
    .blog-page .post-excerpt {
      font-family: var(--font-serif);
      font-size: 1em;
      line-height: 1.6;
    }
    .blog-page .post-meta,
    .blog-page .post-tag,
    .blog-page .tag-filter,
    .blog-page .back-link,
    .blog-page .comments-section h2 {
      font-family: var(--font-mono);
      font-variant-numeric: normal;
    }

    /* --- Post body --- */
    .blog-page .post-content { max-width: var(--blog-measure); }
    .blog-page .post-content h1 {
      font-family: var(--font-serif);
      font-size: 2.15em;
      font-weight: 600;
      line-height: 1.15;
      color: var(--fg0);
      border-bottom: none;
      padding-bottom: 0;
      margin: 0 0 0.4em;
    }
    .blog-page .post-content h2 {
      font-family: var(--font-serif);
      font-size: 1.45em;
      font-weight: 600;
      color: var(--orange);
      border-bottom: none;
      padding-bottom: 0;
      margin: 1.9em 0 0.5em;
    }
    .blog-page .post-content h3 {
      font-family: var(--font-serif);
      font-size: 1.18em;
      font-weight: 600;
      color: var(--yellow);
      margin: 1.5em 0 0.4em;
    }
    .blog-page .post-content p { margin: 0 0 1.1em; }
    .blog-page .post-content li { margin: 0.35em 0; }
    .blog-page .post-content ul,
    .blog-page .post-content ol { color: var(--fg); margin-left: 1.4em; }
    .blog-page .post-content blockquote {
      border-left: 2px solid var(--bg3);
      padding-left: 1.1em;
      margin: 1.4em 0;
      color: var(--fg3);
      font-style: italic;
    }
    /* Semibold, not Bold — Caslon's true bold clots at this size on dark. */
    .blog-page strong, .blog-page b { font-weight: 600; }

    /* Code and math keep the monospace they need. */
    .blog-page code, .blog-page pre, .blog-page pre code { font-family: var(--font-mono); }
    .blog-page code { font-size: 0.78em; }
    .blog-page pre { font-size: 0.8em; }

    /* ===== Serif utility ==================================================
       Page-agnostic version of the blog treatment. Add `serif` to any
       container's class list to set that whole region in Caslon:

           <div class="wiki-article serif">

       Add `serif-display` alongside it to also put that page's own top-level
       <h1> in Irvin:

           <div class="wiki-article serif serif-display">

       No new CSS is needed per page. Colours, borders and layout are left
       exactly as the .wiki-article rules set them — this changes typography
       only. Must stay below the .wiki-article block: the selectors have equal
       specificity, so these win on source order alone. */
    .serif {
      font-family: var(--font-serif);
      font-size: var(--blog-size);
      line-height: 1.65;
      font-kerning: normal;
      font-variant-numeric: oldstyle-num;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Caslon's small x-height means the inherited heading sizes read a step
       too quiet; these nudge them back. Delete if you prefer the originals. */
    .serif h1, .serif h2, .serif h3, .serif h4 { font-family: var(--font-serif); }
    .serif h1 { font-weight: 600; font-size: 2em; line-height: 1.15; }
    .serif h2 { font-weight: 600; font-size: 1.4em; }
    .serif h3 { font-weight: 600; font-size: 1.15em; }
    /* One measure for every prose block, headings included, so the column has
       a single right edge instead of paragraphs stopping short of the heading
       rules. Deliberately NOT centred: margin-inline:auto here would indent
       the text away from the headings' left edge, and a consistent left edge
       matters far more to the eye than a consistent right one. The h1 and the
       infobox still use the full article width. */
    .serif p, .serif ul, .serif ol,
    .serif h2, .serif h3, .serif h4,
    .serif blockquote { max-width: var(--serif-measure); }
    .serif strong, .serif b { font-weight: 600; }

    /* Chrome and code stay monospace wherever they turn up inside a serif
       region — the infobox, TOC and tables are UI, not prose. */
    .serif code, .serif pre, .serif pre code,
    .serif .infobox, .serif .toc, .serif .categories-box,
    .serif .category-tag, .serif .post-meta,
    .serif .hw-table, .serif .file-item {
      font-family: var(--font-mono);
      font-variant-numeric: normal;
    }
    .serif code { font-size: 0.78em; }
    .serif .infobox p, .serif .toc li { max-width: none; }

    /* Irvin, for the page's own title only. Direct child, so headings inside
       nested content are unaffected. */
    .serif-display > h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.12;
      letter-spacing: 0.01em;
    }

    /* Opting the infobox itself in: <div class="infobox serif">.
       Two things this has to work around. It must out-rank the
       `.serif .infobox` rule above, which pushes the infobox back to mono
       whenever it sits inside a serif page — equal specificity on the first
       selector, so it wins on source order, and the second selector covers
       the nested case outright. And the label/value/caption sizes are set in
       absolute rem, so they never inherit the 18px from .serif; at 0.8rem
       Caslon is unreadably small, hence the bumps. */
    .infobox.serif,
    .serif .infobox.serif {
      font-family: var(--font-serif);
      font-variant-numeric: oldstyle-num;
      font-size: var(--infobox-serif-size);
    }
    .infobox.serif .infobox-title,
    .infobox.serif .infobox-subtitle,
    .infobox.serif .infobox-caption,
    .infobox.serif .infobox-label,
    .infobox.serif .infobox-value {
      font-family: var(--font-serif);
    }
    .infobox.serif .infobox-title { font-size: 1.15rem; }
    .infobox.serif .infobox-subtitle { font-size: 0.88rem; }
    .infobox.serif .infobox-caption { font-size: 0.85rem; }
    .infobox.serif .infobox-label,
    .infobox.serif .infobox-value { font-size: var(--infobox-serif-size); }
    /* Caslon sets narrower than mono at the same size, so the label column can
       give a little back to the values without "GitHub and contact" wrapping
       badly. Keeps the long addresses on fewer lines. */
    .infobox.serif .infobox-label { width: 100px; }

    /* Films & music styles */
    .film-list { list-style: none; margin: 0; padding: 0; counter-reset: filmrank; }
    .film-item {
      padding: 0.85rem 1rem 0.85rem 3.2rem;
      margin: 0.5rem 0;
      background: var(--bg);
      border: 1px solid var(--bg2);
      border-radius: 4px;
      counter-increment: filmrank;
      position: relative;
      transition: border-color 0.15s;
    }
    .film-item:hover { border-color: var(--bg3); }
    .film-item::before {
      content: counter(filmrank, decimal-leading-zero);
      position: absolute;
      left: 0.9rem;
      top: 0.95rem;
      color: var(--yellow);
      font-size: 0.85rem;
    }
    .film-title { color: var(--blue); font-weight: 500; }
    .film-meta { color: var(--fg4); font-size: 0.85rem; margin-left: 0.5rem; }
    .film-note { color: var(--fg2); font-size: 0.9rem; margin-top: 0.35rem; }
    .music-list { list-style: none; margin: 0 0 1rem; padding: 0; }
    .music-item {
      padding: 0.75rem 1rem;
      margin: 0.5rem 0;
      background: var(--bg);
      border: 1px solid var(--bg2);
      border-radius: 4px;
      transition: border-color 0.15s;
    }
    .music-item:hover { border-color: var(--bg3); }
    .music-head { color: var(--blue); font-weight: 500; }
    .music-note { color: var(--fg2); font-size: 0.9rem; margin-top: 0.35rem; }
    .music-player { margin-top: 0.6rem; width: 100%; max-width: 420px; height: 34px; }
    .lb-footnote { color: var(--fg4); font-size: 0.8rem; margin-top: 0.5rem; }

    /* Tag cloud for filtering */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--bg2);
    }
    .tag-filter {
      background: var(--bg1);
      color: var(--fg4);
      padding: 0.25rem 0.75rem;
      border-radius: 3px;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid var(--bg2);
      transition: all 0.15s;
    }
    .tag-filter:hover { background: var(--bg2); color: var(--fg); }
    .tag-filter.active { background: var(--aqua); color: var(--bg-hard); border-color: var(--aqua); }
    .post-content { line-height: 1.8; }
    .post-content h1 { color: var(--fg0); font-size: 1.6rem; margin: 1.5rem 0 1rem; }
    .post-content h2 { color: var(--orange); font-size: 1.3rem; margin: 1.5rem 0 0.75rem; border-bottom: 1px solid var(--bg2); padding-bottom: 0.3rem; }
    .post-content h3 { color: var(--yellow); font-size: 1.1rem; margin: 1rem 0 0.5rem; }
    .post-content p { margin: 0.75rem 0; }
    .post-content ul, .post-content ol { margin: 0.75rem 0 0.75rem 1.5rem; }
    .post-content li { margin: 0.3rem 0; }
    .post-content table { border-collapse: collapse; margin: 1rem 0; }
    .post-content th, .post-content td { border: 1px solid var(--bg3); padding: 0.5rem 1rem; }
    .post-content th { background: var(--bg1); color: var(--fg0); }
    .post-content blockquote { border-left: 3px solid var(--purple); padding-left: 1rem; margin: 1rem 0; color: var(--fg3); }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--blue); }
    .back-link:before { content: "← "; }

    /* Comments section */
    .comments-section {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--bg3);
    }
    .comments-section h2 {
      color: var(--orange);
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .giscus {
      margin-top: 1rem;
    }

    /* Course directory styles */
    .course-tree { margin: 1rem 0; }
    .dept-section { margin-bottom: 1.5rem; }
    .dept-header { 
      display: flex; 
      align-items: center; 
      gap: 0.5rem; 
      padding: 0.5rem; 
      background: var(--bg1); 
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      color: var(--purple);
    }
    .dept-header:hover { background: var(--bg2); }
    .dept-toggle { color: var(--blue); width: 1rem; }
    .course-list { list-style: none; margin: 0; padding: 0; }
    .course-item { 
      margin: 0.25rem 0 0.25rem 1.5rem; 
      padding: 0.5rem 0.75rem;
      border-left: 1px solid var(--bg2);
    }
    .course-header { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .course-header:hover .course-title { color: var(--aqua); }
    .course-number { color: var(--orange); font-weight: 500; min-width: 60px; }
    .course-title { color: var(--blue); }
    .course-status { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 3px; }
    .course-status.active { background: var(--green); color: var(--bg-hard); }
    .course-status.planned { background: var(--bg2); color: var(--fg4); }
    .course-details { margin-top: 0.5rem; padding-left: 1rem; display: none; }
    .course-details.open { display: block; }
    .course-desc { color: var(--fg3); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .materials-list { list-style: none; margin: 0; padding: 0; }
    .material-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
    .material-icon { color: var(--red); }
    .material-icon.video { color: var(--red); }
    .material-icon.pdf { color: var(--orange); }
    .material-link { color: var(--aqua); font-size: 0.9rem; }
    .course-list.collapsed { display: none; }

    /* Notes system styles */
    .notes-courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .notes-course-card { background: var(--bg1); border: 1px solid var(--bg3); border-radius: 4px; padding: 1.5rem; transition: border-color 0.2s; }
    .notes-course-card:hover { border-color: var(--aqua); }
    .notes-course-link { text-decoration: none; }
    .notes-course-link h3 { color: var(--aqua); margin: 0 0 0.5rem 0; }
    .notes-course-link p { color: var(--fg2); margin: 0; }
    .homework-type-badge { display: inline-block; margin-top: 0.75rem; padding: 0.25rem 0.5rem; background: var(--bg2); color: var(--purple); font-size: 0.75rem; border-radius: 3px; }
    .homework-date { color: var(--fg3); font-size: 0.85rem; margin-left: 0.5rem; }
    
    .note-breadcrumb { color: var(--fg3); margin-bottom: 1.5rem; font-size: 0.9rem; }
    .note-breadcrumb a { color: var(--aqua); text-decoration: none; }
    .note-breadcrumb a:hover { text-decoration: underline; }
    
    .note-toc { margin-top: 1.5rem; }
    .note-chapter { margin-bottom: 2rem; }
    .note-chapter h2 { color: var(--yellow); font-size: 1.2rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--bg3); padding-bottom: 0.5rem; }
    .note-section-list { list-style: none; padding: 0; margin: 0; }
    .note-section-list li { padding: 0.4rem 0; }
    .note-section-list a { color: var(--aqua); text-decoration: none; }
    .note-section-list a:hover { text-decoration: underline; }
    
    .note-nav { display: flex; justify-content: space-between; margin: 1.5rem 0; padding: 1rem 0; border-top: 1px solid var(--bg3); border-bottom: 1px solid var(--bg3); }
    .note-nav a { color: var(--aqua); text-decoration: none; }
    .note-nav a:hover { text-decoration: underline; }
    .note-nav-prev::before { content: "← "; }
    .note-nav-next::after { content: " →"; }
    
    .note-box { margin: 1.5rem 0; padding: 1rem; border-left: 4px solid; background: var(--bg1); border-radius: 0 4px 4px 0; }
    .note-box-title { font-weight: bold; margin-bottom: 0.5rem; font-size: 1.1rem; }
    .note-box-content p:last-child { margin-bottom: 0; }
    
    .note-definition { border-color: var(--aqua); }
    .note-definition .note-box-title { color: var(--aqua); }
    
    .note-theorem { border-color: var(--green); }
    .note-theorem .note-box-title { color: var(--green); }
    
    .note-example { border-color: var(--yellow); background: var(--bg2); }
    
    .note-proof { border-color: var(--purple); }

    // Router
    let pendingScrollTarget = null;
    
    async function navigate(path) {
      // Normalize trailing slashes (but keep root /)
      if (path !== '/' && path.endsWith('/')) {
        path = path.slice(0, -1);
      }
      
      // Check for blog post route
      if (path.startsWith('/blog/') && path !== '/blog') {
        const slug = path.replace('/blog/', '');
        await loadBlogPost(slug);
        return;
      }
      
      // Check for notes routes
      const notesParts = path.split('/').filter(p => p);
      if (notesParts[0] === 'notes' && notesParts.length === 2) {
        // /notes/calculus-i -> course overview
        await loadCourseOverview(notesParts[1]);
        return;
      }
      if (notesParts[0] === 'notes' && notesParts.length === 3) {
        // /notes/calculus-i/2-2-the-limit -> section content
        await loadNoteSection(notesParts[1], notesParts[2]);
        return;
      }
      
      // Check for homework routes
      const hwParts = path.split('/').filter(p => p);
      if (hwParts[0] === 'homework' && hwParts.length === 2) {
        // /homework/math-55a -> course assignments list
        await loadHomeworkCourse(hwParts[1]);
        return;
      }
      if (hwParts[0] === 'homework' && hwParts.length === 3) {
        // /homework/math-55a/pset-1 -> assignment content
        await loadHomeworkAssignment(hwParts[1], hwParts[2]);
        return;
      }

      const content = pages[path];
      if (!content) {
        document.getElementById('app').innerHTML = `
          <div class="wiki-article">
            <h1>404 — Not Found</h1>
            <p>No file at <code>${path}</code></p>
            <p><a href="/" data-link>Return home</a></p>
          </div>
        `;
        document.getElementById('status-file').textContent = '~/stephens/404';
        history.pushState({}, '', path);
        return;
      }
      if (content === 'dynamic') return; // handled above
      
      document.getElementById('app').innerHTML = content;
      
      document.querySelectorAll('.nav-tabs a').forEach(a => {
        const href = a.getAttribute('href');
        const isActive = path === href || (path.startsWith('/blog/') && href === '/blog');
        a.classList.toggle('active', isActive);
      });
      document.querySelectorAll('.file-item').forEach(item => {
        item.classList.toggle('active', item.dataset.link === path);
      });
      
      const pathMap = {
        '/': '~/stephens/home',
        '/about': '~/stephens/about.md',
        '/research': '~/stephens/research.tex',
        '/blog': '~/stephens/blog/',
        '/music': '~/stephens/music.md',
        '/educational': '~/stephens/educational/',
        '/notes': '~/stephens/notes/',
        '/homework': '~/stephens/homework/',
        '/educational': '~/stephens/educational/'
      };
      document.getElementById('status-file').textContent = pathMap[path] || pathMap['/'];
      setTitle(path);
      history.pushState({}, '', path);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      // Load dynamic content
      if (path === '/blog') await loadBlogList();
      if (path === '/music') await loadMusic();
      if (path === '/notes') await loadNotesCourseList();
      if (path === '/homework') await loadHomeworkCourseList();
      if (path === '/educational') await loadCourses();
      
      renderMath();
    }

    function renderMath() {
      if (typeof MathJax !== 'undefined' && MathJax.typeset) {
        MathJax.typeset([document.getElementById('app')]);
      }
    }

    // Markdown with LaTeX protection
    function renderMarkdown(md) {
      // Strip YAML frontmatter if present (tolerant of whitespace)
      md = md.replace(/^--- *\n[\s\S]*?\n--- *\n/, '');
      
      // Protect LaTeX blocks from marked.js
      const blocks = [];
      let protected = md.replace(/\$\$[\s\S]*?\$\$/g, (match) => {
        blocks.push(match);
        return `%%LATEX_BLOCK_${blocks.length - 1}%%`;
      });
      protected = protected.replace(/\$[^\$\n]+?\$/g, (match) => {
        blocks.push(match);
        return `%%LATEX_INLINE_${blocks.length - 1}%%`;
      });
      
      // Parse markdown
      let html = marked.parse(protected);
      
      // Restore LaTeX
      html = html.replace(/%%LATEX_(BLOCK|INLINE)_(\d+)%%/g, (_, type, idx) => blocks[parseInt(idx)]);
      
      return html;
    }

    // Music: own works, arrangements, recordings (driven by /music/music.json)
    async function loadMusic() {
      const container = document.getElementById('music-content');
      if (!container) return;
      try {
        const res = await fetch('/music/music.json');
        const data = await res.json();
        let html = data.intro ? `<p>${data.intro}</p>` : '';
        for (const sec of data.sections) {
          if (!sec.items || sec.items.length === 0) continue;
          html += `<h2>${sec.title}</h2><ul class="music-list">`;
          for (const it of sec.items) {
            let head = it.title || it.name || '';
            if (it.composer) head += ` — ${it.composer}`;
            if (it.year) head += ` (${it.year})`;
            const meta = [it.instrumentation, it.duration].filter(Boolean).join(' · ');
            // A self-hosted file gets an inline player; an off-site link
            // (YouTube, Bandcamp, SoundCloud) stays a link, since those can't
            // be embedded in an <audio> element.
            const isLocalAudio = it.audio && it.audio.startsWith('/');
            const player = isLocalAudio
              ? `<audio class="music-player" controls preload="none" src="${it.audio}"></audio>`
              : '';
            const links = [
              it.score ? `<a href="${it.score}" target="_blank">score</a>` : '',
              (it.audio && !isLocalAudio) ? `<a href="${it.audio}" target="_blank">listen</a>` : ''
            ].filter(Boolean).join(' · ');
            html += `<li class="music-item"><span class="music-head">${head}</span>`
              + (meta ? `<div class="post-meta">${meta}</div>` : '')
              + (it.note ? `<div class="music-note">${it.note}</div>` : '')
              + (links ? `<div class="post-meta">${links}</div>` : '')
              + player
              + '</li>';
          }
          html += '</ul>';
        }
        container.innerHTML = html || '<p>Nothing here yet.</p>';
      } catch (e) {
        container.innerHTML = '<p>Error loading music.</p>';
      }
    }

    // Blog functions
    let allPosts = [];

    async function loadBlogList(filterTag = null) {
      const container = document.getElementById('blog-posts');
      if (!container) return;
      
      try {
        if (allPosts.length === 0) {
          const res = await fetch('/blog/posts.json');
          allPosts = await res.json();
        }
        
        activeTag = filterTag;
        const posts = filterTag 
          ? allPosts.filter(p => p.tags.includes(filterTag))
          : allPosts;
        
        if (posts.length === 0) {
          container.innerHTML = '<p>No posts found.</p>';
          return;
        }
        
        // Get all unique tags for the tag cloud
        const allTags = [...new Set(allPosts.flatMap(p => p.tags))].sort();
        
        const tagCloud = `
          <div class="tag-cloud">
            <span class="tag-filter ${!activeTag ? 'active' : ''}" data-tag="">all</span>
            ${allTags.map(t => `<span class="tag-filter ${activeTag === t ? 'active' : ''}" data-tag="${t}">${t}</span>`).join('')}
          </div>
        `;
        
        container.innerHTML = tagCloud + '<ul class="post-list">' + posts.map(post => `
          <li class="post-item">
            <a href="/blog/${post.slug}" class="post-title" data-link>${post.title}</a>
            <div class="post-meta">${post.date}</div>
            <div class="post-excerpt">${post.excerpt}</div>
            <div class="post-tags">${post.tags.map(t => `<span class="post-tag" data-tag="${t}">${t}</span>`).join('')}</div>
          </li>
        `).join('') + '</ul>';
      } catch (e) {
        container.innerHTML = '<p>Error loading posts.</p>';
      }
    }

    async function loadBlogPost(slug) {
      // Check if we're returning from Giscus auth (URL has giscus hash or we already have the right post loaded)
      const currentSlug = window.location.pathname.replace('/blog/', '');
      const existingGiscus = document.querySelector('.giscus iframe');
      const existingPostContent = document.querySelector('.post-content');
      
      // If same post is already loaded and Giscus iframe exists, don't reload (preserves auth state)
      if (existingGiscus && existingPostContent && currentSlug === slug) {
        return;
      }
      
      document.getElementById('app').innerHTML = '<p class="loading">Loading post...</p>';
      
      try {
        const res = await fetch(`/blog/${slug}.md`);
        if (!res.ok) throw new Error('Not found');
        const md = await res.text();
        const html = renderMarkdown(md);
        
        document.getElementById('app').innerHTML = `
          <div class="wiki-article blog-page">
            <a href="/blog" class="back-link" data-link>Back to blog</a>
            <div class="post-content">${html}</div>
            <div class="comments-section">
              <h2>Comments</h2>
              <div class="giscus"></div>
            </div>
          </div>
        `;
        
        document.getElementById('status-file').textContent = `~/stephens/blog/${slug}.md`;
        // Title comes from the rendered post's own <h1> so it matches what
        // meta.php pulls from posts.json, falling back to the slug.
        const postH1 = document.querySelector('.post-content h1');
        setTitle(postH1 ? postH1.textContent.trim() : slug);
        // Preserve giscus auth token in URL if present (needed for auth callback)
        const giscusParam = window.location.search.includes('giscus') ? window.location.search : '';
        history.pushState({}, '', `/blog/${slug}${giscusParam}`);
        renderMath();
        loadGiscus();
      } catch (e) {
        document.getElementById('app').innerHTML = `
          <div class="wiki-article">
            <a href="/blog" class="back-link" data-link>Back to blog</a>
            <p>Post not found.</p>
          </div>
        `;
      }
    }

      script.setAttribute('data-category', 'General');
      script.setAttribute('data-category-id', 'DIC_kwDOQop0ks4CzyZd');
      script.setAttribute('data-mapping', 'pathname');

    async function loadNoteSection(courseSlug, sectionSlug) {
      try {
        // Load course.json for nav context
        const courseRes = await fetch(`/notes/${courseSlug}/course.json`);
        const course = await courseRes.json();
        
        // Load section markdown
        const mdRes = await fetch(`/notes/${courseSlug}/${sectionSlug}.md`);
        const md = await mdRes.text();
        
        // Find current section and prev/next
        let prevSection = null, nextSection = null, currentSection = null, currentChapter = null;
        let allSections = [];
        for (const chapter of course.chapters) {
          for (const section of chapter.sections) {
            allSections.push({ section, chapter });
          }
        }
        const idx = allSections.findIndex(s => s.section.slug === sectionSlug);
        if (idx >= 0) {
          currentSection = allSections[idx].section;
          currentChapter = allSections[idx].chapter;
          if (idx > 0) prevSection = allSections[idx - 1].section;
          if (idx < allSections.length - 1) nextSection = allSections[idx + 1].section;
        }
        
        // Render content
        const rendered = renderNoteMarkdown(md);
        
        let html = `
          <div class="wiki-article serif note-section">
            <div class="note-breadcrumb">
              <a href="/notes" data-link>Notes</a> / 
              <a href="/notes/${courseSlug}" data-link>${course.title}</a> /

    function renderNoteMarkdown(md) {
      // Strip frontmatter
      md = md.replace(/^--- *\n[\s\S]*?\n--- *\n/, '');
      
      // FIRST: Protect all LaTeX globally before ANY processing
      const latexBlocks = [];
      md = md.replace(/\$\$[\s\S]*?\$\$/g, (match) => {
        latexBlocks.push(match);
        return `%%LATEX_BLOCK_${latexBlocks.length - 1}%%`;
      });
      md = md.replace(/\$[^\$\n]+?\$/g, (match) => {
        latexBlocks.push(match);
        return `%%LATEX_INLINE_${latexBlocks.length - 1}%%`;
      });
      
      // Helper to process inner content (just marked, LaTeX already protected)
      const processInner = (content) => marked.parse(content);
      
      // Convert :::example with nested :::solution (must come first)
      // Handle both ":::example\n" and ":::example Title\n" formats
      // Use negative lookahead to not cross other ::: boundaries
      md = md.replace(/:::example[ \t]*([^\n]*)\n((?:(?!:::).|\n)*?):::solution\s*[\r\n]+([\s\S]*?):::\s*[\r\n]*:::/g,
        (_, title, ex, sol) => {
          const titleHtml = title.trim() ? `<div class="note-box-title">${processInner(title.trim())}</div>` : '';
          return `<div class="note-box note-example">${titleHtml}<div class="note-box-content">${processInner(ex.trim())}</div><details class="note-solution"><summary>Show Solution</summary><div class="note-solution-content">${processInner(sol.trim())}</div></details></div>`;
        });
      
      // Convert standalone :::example blocks (no solution)
      // Handle both ":::example\n" and ":::example Title\n" formats
      md = md.replace(/:::example[ \t]*([^\n]*)\n([\s\S]*?):::/g,
        (_, title, content) => {
          const titleHtml = title.trim() ? `<div class="note-box-title">${processInner(title.trim())}</div>` : '<div class="note-box-title">Example</div>';
          return `<div class="note-box note-example">${titleHtml}<div class="note-box-content">${processInner(content.trim())}</div></div>`;
        });
      
      // Convert :::definition blocks
      md = md.replace(/:::definition\s*[\r\n]+([\s\S]*?):::/g, 
        (_, content) => `<div class="note-box note-definition"><div class="note-box-title">Definition</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::theorem blocks (with optional nested :::proof)
      // Use negative lookahead to not cross other ::: boundaries
      md = md.replace(/:::theorem\s*[\r\n]+((?:(?!:::).|\n)*?):::proof\s*[\r\n]+([\s\S]*?):::\s*[\r\n]*:::/g,
        (_, thm, proof) => `<div class="note-box note-theorem"><div class="note-box-title">Theorem</div><div class="note-box-content">${processInner(thm.trim())}</div><div class="note-box note-proof"><div class="note-box-title">Proof</div><div class="note-box-content">${processInner(proof.trim())}</div></div></div>`);
      
      // Convert standalone :::theorem blocks
      md = md.replace(/:::theorem\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-theorem"><div class="note-box-title">Theorem</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::proof blocks
      md = md.replace(/:::proof\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-proof"><div class="note-box-title">Proof</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::note blocks
      md = md.replace(/:::note\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-note"><div class="note-box-title">Note</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::proposition blocks (with optional nested :::proof)
      // Use negative lookahead to not cross other ::: boundaries
      md = md.replace(/:::proposition\s*[\r\n]+((?:(?!:::).|\n)*?):::proof\s*[\r\n]+([\s\S]*?):::\s*[\r\n]*:::/g,
        (_, prop, proof) => `<div class="note-box note-proposition"><div class="note-box-title">Proposition</div><div class="note-box-content">${processInner(prop.trim())}</div><div class="note-box note-proof"><div class="note-box-title">Proof</div><div class="note-box-content">${processInner(proof.trim())}</div></div></div>`);
      
      // Convert standalone :::proposition blocks
      md = md.replace(/:::proposition\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-proposition"><div class="note-box-title">Proposition</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Convert :::corollary blocks
      md = md.replace(/:::corollary\s*[\r\n]+([\s\S]*?):::/g,
        (_, content) => `<div class="note-box note-corollary"><div class="note-box-title">Corollary</div><div class="note-box-content">${processInner(content.trim())}</div></div>`);
      
      // Process remaining markdown outside boxes
      let html = marked.parse(md);
      
      // Restore ALL LaTeX at the very end
      html = html.replace(/%%LATEX_(BLOCK|INLINE)_(\d+)%%/g, (_, type, idx) => latexBlocks[parseInt(idx)]);
      
      return html;
    }

        const assignments = data.assignments;
        const idx = assignments.findIndex(a => a.slug === assignmentSlug);
        const current = idx >= 0 ? assignments[idx] : null;
        const prev = idx > 0 ? assignments[idx - 1] : null;
        const next = idx < assignments.length - 1 ? assignments[idx + 1] : null;
        
        const rendered = renderNoteMarkdown(md);
        const files = current?.files || {};
        let dlBar = '';
        if (files.pdf || files.tex) {
          dlBar = '<div class="hw-downloads" style="margin-bottom:1.5rem">';

          if (files.tex) dlBar += `<a href="/homework/${courseSlug}/${files.tex}" class="hw-dl tex" target="_blank">⬇ tex</a>`;

        let html = `

            <div class="note-nav">
              ${prev ? `<a href="/homework/${courseSlug}/${prev.slug}" class="note-nav-prev" data-link>${prev.title}</a>` : '<span></span>'}

      document.getElementById('status-file').textContent = statusPath;

    // Click handler - fixed for anchor links
    document.addEventListener('click', (e) => {
      // Handle tag filtering
      const tagEl = e.target.closest('.tag-filter, .post-tag');
      if (tagEl && tagEl.dataset.tag !== undefined) {
        e.preventDefault();
        const tag = tagEl.dataset.tag || null;
        loadBlogList(tag);
        return;
      }

      // Handle folder toggles
      const folderToggle = e.target.closest('.folder-toggle');
      if (folderToggle) {
        e.preventDefault();
        const folder = folderToggle.closest('.file-folder');
        if (folder) toggleFolder(folder);
        return;
      }

      const link = e.target.closest('a[href^="#"]');
      if (link) {
        e.preventDefault();
        const targetId = link.getAttribute('href').slice(1);
        const target = document.getElementById(targetId);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        return;
      }
      
      const navLink = e.target.closest('[data-link]');
      if (navLink) {
        e.preventDefault();
        const href = navLink.getAttribute('href') || navLink.dataset.link;
        const scrollTarget = navLink.dataset.scroll;
        if (scrollTarget) pendingScrollTarget = scrollTarget;
        navigate(href);
      }
    });

    // Get all navigable items in the explorer (only visible ones, not in closed folders)
    function getFileItems() {
      return Array.from(document.querySelectorAll('#file-tree .file-item')).filter(item => {
        // Check if item is inside ANY closed folder (traverse all ancestors)
        let el = item.parentElement;
        while (el && el.id !== 'file-tree') {
          if (el.classList.contains('folder-children')) {
            const folder = el.closest('.file-folder');
            if (folder && !folder.classList.contains('open')) {
              return false; // Skip items in closed folders
            }
          }
          el = el.parentElement;
        }
        return true;
      });
    }

    function setMode(mode) {
      statusMode.textContent = mode;

    }

    function toggleExplorer() {
      const isActive = fileExplorer.classList.toggle('active');
      if (isActive) {
        explorerFocusIndex = 0;
        updateExplorerFocus();
      } else {
        explorerFocusIndex = -1;
        getFileItems().forEach(item => item.classList.remove('focused'));
      }
    }

    function updateExplorerFocus() {
      const items = getFileItems();
      items.forEach((item, i) => {
        item.classList.toggle('focused', i === explorerFocusIndex);
      });
      if (explorerFocusIndex >= 0 && items[explorerFocusIndex]) {
        items[explorerFocusIndex].scrollIntoView({ block: 'nearest' });
      }
    }

    cmdlineInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const input = cmdlineInput.value.trim();
        const cmd = input.toLowerCase().split(' ')[0];
        const args = input.slice(cmd.length).trim();
        closeCmdline();
        
        if (cmdlineMode === 'search') {
          // Search mode: fuzzy navigate to pages
          if (cmd.includes('home') || cmd === 'h') navigate('/');
          else if (cmd.includes('about') || cmd === 'a') navigate('/about');
          else if (cmd.includes('research') || cmd === 'r') navigate('/research');
          else if (cmd.includes('blog') || cmd === 'b') navigate('/blog');
          else if (cmd.includes('tech')) navigate('/educational');
          else if (cmd.includes('note') || cmd === 'n') navigate('/notes');
          else if (cmd.includes('edu') || cmd === 'e') navigate('/educational');
          else if (cmd.includes('music') || cmd === 'm') navigate('/music');
          else if (cmd.includes('help')) showHelp();
        } else {
          // Command mode
          if (commands[cmd]) {
            commands[cmd](args);
          } else if (cmd) {
            showMessage('Unknown command: ' + cmd);
          }
        }
      } else if (e.key === 'Escape') {
        closeCmdline();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      
      const now = Date.now();
      const isDoublePress = (e.key === lastKey) && (now - lastKeyTime < 300);
      const explorerOpen = fileExplorer.classList.contains('active');
      const items = getFileItems();

      // File explorer navigation
      if (explorerOpen) {
        if (e.key === 'ArrowDown' || e.key === 'j') {
          e.preventDefault();
          explorerFocusIndex = Math.min(explorerFocusIndex + 1, items.length - 1);
          updateExplorerFocus();
          lastKey = e.key;
          lastKeyTime = now;
          return;
        }
        if (e.key === 'ArrowUp' || e.key === 'k') {
          e.preventDefault();
          explorerFocusIndex = Math.max(explorerFocusIndex - 1, 0);
          updateExplorerFocus();
          lastKey = e.key;
          lastKeyTime = now;
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          if (explorerFocusIndex >= 0 && items[explorerFocusIndex]) {
            const focusedItem = items[explorerFocusIndex];
            
            // Check if it's a folder toggle
            if (focusedItem.classList.contains('folder-toggle')) {
              const folder = focusedItem.closest('.file-folder');
              if (folder) {
                folder.classList.toggle('open');
                // Stay on the folder item after toggling
                setTimeout(() => {
                  const newItems = getFileItems();
                  explorerFocusIndex = newItems.indexOf(focusedItem);
                  updateExplorerFocus();
                }, 10);
              }
            } else {
              // Regular file item - navigate
              const path = focusedItem.dataset.link;
              const scrollTarget = focusedItem.dataset.scroll;
              if (path) {
                if (scrollTarget) pendingScrollTarget = scrollTarget;
                navigate(path);
                fileExplorer.classList.remove('active');
                explorerFocusIndex = -1;
                items.forEach(item => item.classList.remove('focused'));
              }
            }
          }
          lastKey = e.key;
          lastKeyTime = now;
          return;
        }
        if (e.key === 'Escape') {
          fileExplorer.classList.remove('active');
          explorerFocusIndex = -1;
          items.forEach(item => item.classList.remove('focused'));
          lastKey = e.key;
          lastKeyTime = now;
          return;
        }
      }

      // Leader key (Space)
      if (e.key === ' ' && !cmdline.classList.contains('active')) {
        e.preventDefault();
        showWhichKey();
        clearTimeout(leaderTimeout);
        leaderTimeout = setTimeout(hideWhichKey, 2000);
        lastKey = e.key;
        lastKeyTime = now;
        return;
      }

      // Leader combinations
      if (leaderActive) {
        e.preventDefault();
        hideWhichKey();
        if (e.key === 'e') toggleExplorer();
        else if (e.key === '/') openCmdline();
        lastKey = e.key;
        lastKeyTime = now;
        return;
      }

      // Normal mode
      switch(e.key) {
        case 'j': window.scrollBy({ top: 100, behavior: 'smooth' }); break;
        case 'k': window.scrollBy({ top: -100, behavior: 'smooth' }); break;
        case 'G':
          if (e.shiftKey && isDoublePress) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
          break;
        case 'g':
          if (!e.shiftKey && isDoublePress) window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        case '/':
          e.preventDefault();
          openCmdline('search');
          break;
        case ':':
          e.preventDefault();
          openCmdline('command');
          break;
        case 'Escape':
          closeCmdline();
          hideWhichKey();
          break;
      }
      lastKey = e.key;
      lastKeyTime = now;
    });

    // Status bar
    function updateScrollPosition() {
      const scrollTop = window.scrollY;
      const scrollHeight = document.body.scrollHeight - window.innerHeight;
      const pos = document.getElementById('status-position');
      if (scrollTop <= 10) pos.textContent = 'Top';
      else if (scrollTop >= scrollHeight - 10) pos.textContent = 'Bot';
      else pos.textContent = Math.round((scrollTop / scrollHeight) * 100) + '%';
    }

    function updateTime() {
      document.getElementById('status-time').textContent = new Date().toLocaleTimeString('en-US', { 
        hour: '2-digit', minute: '2-digit', hour12: false 
      });
    }

    window.addEventListener('scroll', updateScrollPosition);
    setInterval(updateTime, 1000);

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      navigate(window.location.pathname);
      updateScrollPosition();
      updateTime();
      loadExplorerFolders();
    });
  </script>
</body>
</html>
